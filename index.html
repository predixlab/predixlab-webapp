<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111915" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PredixLab" />
    <meta name="description" content="PredixLab tracks pivot signals, market breadth and unusual options flow across the US equity universe." />
    <title>PredixLab - Quantization and AI Stock Analysis</title>
    <script>
      // Resolve the theme before first paint so the app never flashes the
      // wrong surface. Light is the default; an explicit choice wins over
      // the OS preference.
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('predixlab-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {
          /* private mode: fall through to light */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
